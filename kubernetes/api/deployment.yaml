apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizzabox-api
  namespace: pizzabox-app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pizzabox-api
  template:
    metadata:
      labels:
        app: pizzabox-api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: 'ScheduleAnyway'
          labelSelector:
            matchLabels:
              app: pizzabox-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: 'ScheduleAnyway'
          labelSelector:
            matchLabels:
              app: pizzabox-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      serviceAccountName: s3-uploader-serviceaccount
      restartPolicy: Always
      containers:
        - name: pizzabox-api
          image: 651447471372.dkr.ecr.ap-south-1.amazonaws.com/pizzabox-backend
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pizzabox-config
            - secretRef:
                name: pizzabox-secret
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
