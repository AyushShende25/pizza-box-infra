apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizzabox-api
  namespace: pizzabox-app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pizzabox-api
  template:
    metadata:
      labels:
        app: pizzabox-api
    spec:
      restartPolicy: Always
      containers:
        - name: pizzabox-api
          image: pizzabox
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          envFrom:
            - secretRef:
                name: pizzabox-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          ports:
            - containerPort: 8000
