

image:
  repository: 651447471372.dkr.ecr.ap-south-1.amazonaws.com/pizzabox-backend
  pullPolicy: Always
  tag: 'latest'

configMapName: pizzabox-config
secretName: pizzabox-secret

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

api:
  enabled: true
  replicaCount: 2
  containerPort: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  probes:
    startup:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 30
      periodSeconds: 10
    readiness:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
    liveness:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 30
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

worker:
  enabled: true
  replicaCount: 2
  command:
    - /app/.venv/bin/celery
    - -A
    - app.core.celery_app.celery_app
    - worker
    - --loglevel=INFO
    - --concurrency=2
    - --max-tasks-per-child=100
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      exec:
        command:
          - /bin/sh
          - -c
          - /app/.venv/bin/celery -A app.core.celery_app.celery_app inspect ping -d celery@${HOSTNAME}
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 15
      failureThreshold: 3


ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '3'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200'
  hosts:
    - host: api.pizzabox.fullstackprojects.dev
      paths:
        - path: /
          pathType: Prefix

externalSecret:
  enabled: true
  refreshInterval: 1h
  creationPolicy: Owner
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  remoteKey: pizzabox/production/api

configMap:
  enabled: true
  data:
    APP_ENV: "production"
    LOG_LEVEL: "WARNING"
    BASE_URL: "https://api.pizzabox.fullstackprojects.dev"
    CLIENT_URL: "https://pizzabox.fullstackprojects.dev"
    ADMIN_URL: "https://admin.pizzabox.fullstackprojects.dev"

    JWT_ALGORITHM: "HS256"
    ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    REFRESH_TOKEN_EXPIRE_HOURS: "24"

    MAIL_TOKEN_EXPIRE_SECONDS: "900"
    MAIL_FROM: "pizzabox@fullstackprojects.dev"
    MAIL_FROM_NAME: "PizzaBox"
    MAIL_PORT: "587"
    MAIL_SERVER: "live.smtp.mailtrap.io"

    BUCKET_CUSTOM_DOMAIN: "https://your-bucket-cdn-or-url"
    BUCKET_NAME: "media.pizzabox.fullstackprojects.dev"
    BUCKET_REGION_NAME: "ap-south-1"