{{- if .Values.api.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pizzabox.fullname" . }}-api-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pizzabox.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "pizzabox.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}